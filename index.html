<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lucakerz.web.id | Private Environment</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Background Grid */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Floating Light Effect */
        .light-ray {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(5, 5, 5, 0) 70%);
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .brand-logo {
            font-size: 1rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            color: #3b82f6;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981; /* Green status */
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #64748b;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-main {
            background: #ffffff;
            color: #000000;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #ffffff;
        }

        footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: #334155;
            font-size: 0.75rem;
            letter-spacing: 2px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="light-ray"></div>

    <div class="container">
        <div class="brand-logo">lucakerz</div>
        
        <div class="status-wrapper">
            <div class="status-dot"></div>
            <span class="status-text">Server Operational</span>
        </div>

        <h1>Private Workspace.</h1>
        
        <p>Website ini dikonfigurasi untuk penggunaan pribadi. Jika Anda bukan pemilik, silakan kembali atau hubungi administrator.</p>
        
        <div class="actions">
            <a href="/login" class="btn btn-main">Administrator Login</a>
            <a href="https://codingaja.com" class="btn btn-outline">Public Portal</a>
        </div>
    </div>

    <footer>
        &copy; 2026 LUCAKERZ ENVIRONMENT
    </footer>

</body>
</html>
